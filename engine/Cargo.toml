# Crates from SK8-ENGINE/skate-3-rust-engine (commit cb79689) that the skate
# mode links. Built as path dependencies of the IW4L workspace.
[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-net", "crates/skate-audio", "crates/skate-audio-fma"]
exclude = ["crates/skate-host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }
